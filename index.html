  <style>
    :root {
      --navy: #0f2555;
      --navy-deep: #0a1a3f;
      --green: #01ad45;
      --green-hover: #13c457;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--navy);
      font-family: "Noto Sans KR", "Noto Sans CJK KR", "Source Han Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* 초대장: 원본 비율(566 x 1006) 유지 */
    .invitation {
      position: relative;
      /* 브라우저 세로 높이에 꽉 차게 (가로가 좁으면 가로 기준으로 맞춤) */
      width: min(100vw, calc(100vh * 512 / 910));
      width: min(100vw, calc(100dvh * 512 / 910));
      aspect-ratio: 512 / 910;
      container-type: inline-size;
      background: var(--navy);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
    }

    /* 모바일: 그림자 없이 화면 배경과 자연스럽게 이어지도록 */
    @media (max-width: 600px) {
      .invitation { box-shadow: none; }
    }

    .invitation img {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 참가등록 버튼: 일정·장소 정보 아래 빈 공간에 배치 (원본 좌측 정렬선에 맞춤) */
    .register-btn {
      position: absolute;
      left: 8.2%;
      top: 82.8%;
      width: 52%;
      height: 5.3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5.5cqw 0 6cqw;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-size: 3.5cqw;
      font-weight: 700;
      letter-spacing: -0.01em;
      border-radius: 1.2cqw;
    }

    /* 버튼 문구: HD현대체 Bold를 아웃라인(벡터)으로 변환해 삽입 — 폰트 파일 미포함 */
    .register-btn .label {
      height: 3.2cqw;
      width: auto;
      display: block;
    }

    .register-btn .arrow {
      width: 3.4cqw;
      height: 3.4cqw;
      flex-shrink: 0;
    }

    .register-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* 컨테이너 쿼리 미지원 브라우저 대비 */
    @supports not (container-type: inline-size) {
      .register-btn { font-size: clamp(12px, 3.3vw, 18px); padding: 0 24px 0 28px; border-radius: 6px; }
      /* 버튼 문구: HD현대체 Bold를 아웃라인(벡터)으로 변환해 삽입 — 폰트 파일 미포함 */
    .register-btn .label {
      height: 3.2cqw;
      width: auto;
      display: block;
    }

    .register-btn .arrow { width: 18px; height: 18px; }
    }
  </style>
